<ActionBar title="Computer Scientists" iosLargeTitle="true">

    <ActionItem
            text="☰"
            (tap)="openDrawer()"
            android.position="actionBar">
    </ActionItem>

</ActionBar>

<GridLayout rows="auto,*">

    <SearchBar
            row="0"
            hint="Search scientists..."
            (textChange)="onSearchChange($event)">
    </SearchBar>

    <ListView
            row="1"
            [items]="filteredItems()">

        <ng-template let-item="item">
            <StackLayout [nsRouterLink]="['/item', item.id]">
                <Label
                        [text]="item.name"
                        class="text-lg text-gray-500 p-4">
                </Label>
            </StackLayout>
        </ng-template>

    </ListView>

</GridLayout>
