<GridLayout>
    <page-router-outlet></page-router-outlet>

    <GridLayout
            *ngIf="drawerOpen"
            columns="260,*"
            backgroundColor="#66000000">

        <StackLayout
                col="0"
                backgroundColor="white"
                padding="20">

            <Label
                    text="Menu"
                    fontSize="24"
                    fontWeight="bold"
                    marginBottom="20">
            </Label>

            <Button
                    text="Home"
                    (tap)="navigate('/home')">
            </Button>

            <Button
                    text="Native Features"
                    (tap)="navigate('/native-features')">
            </Button>

            <Button
                    text="Google Maps"
                    (tap)="navigate('/maps')">
            </Button>

            <Button
                    text="Computer Scientists"
                    (tap)="navigate('/items')">
            </Button>

            <Button
                    text="Books"
                    (tap)="navigate('/books')">
            </Button>

            <Button
                    text="Technologies"
                    (tap)="navigate('/technologies')">
            </Button>

            <Button
                    text="Favorites"
                    (tap)="navigate('/favorites')">
            </Button>

            <Button
                    text="Settings"
                    (tap)="navigate('/settings')">
            </Button>

        </StackLayout>

        <GridLayout
                col="1"
                (tap)="closeDrawer()">
        </GridLayout>

    </GridLayout>
</GridLayout>
