<GridLayout>
    <page-router-outlet></page-router-outlet>

    <GridLayout
            *ngIf="drawerOpen"
            columns="260,*"
            backgroundColor="#66000000">

        <StackLayout
                col="0"
                backgroundColor="white"
                padding="20">

            <Label
                    text="Menu"
                    fontSize="24"
                    fontWeight="bold"
                    marginBottom="20">
            </Label>

            <Button
                    text="Computer Scientists"
                    (tap)="navigate('/')">
            </Button>
            <Button
                    text="Technologies"
                    (tap)="navigate('/technologies')">
            </Button>

        </StackLayout>

        <GridLayout
                col="1"
                (tap)="closeDrawer()">
        </GridLayout>

    </GridLayout>
</GridLayout>
